syntax = "proto3";

package latencystorm.v1;
option csharp_namespace = "LatencyStorm.Contracts.V1";
option go_package = "github.com/andrey-x-code/latencystorm/contracts/go/gen/latencystorm/v1;contractsv1";

import "google/protobuf/timestamp.proto";
import "latencystorm/v1/model.proto";

// Kafka value: UTF-8 ProtoJSON of ResultBatch, never hand-written language DTOs.
message ResultBatch {
  uint32 schema_version = 1;
  string run_id = 2;
  string assignment_id = 3;
  string agent_id = 4;
  uint64 sequence = 5; // Consecutive from 1, including the final batch.
  MeasurementInterval interval = 6;
  RequestCounters counters = 7;
  repeated HttpStatusCount http_status_counts = 8;
  LatencyHistogram http_latency = 9;
  LatencyHistogram failure_latency = 10;
  bool is_final = 11;
  // Sticky; set if any samples/batches were lost before this batch.
  bool measurements_lost = 12;
  // Present only in the final batch; counters above remain deltas, not totals.
  AssignmentSummary summary = 13;
}
message MeasurementInterval {
  google.protobuf.Timestamp start_at = 1;
  google.protobuf.Timestamp end_at = 2;
}
message RequestCounters {
  uint64 scheduled = 1;
  uint64 started = 2;
  uint64 skipped = 3;
  uint64 finished = 4;
  uint64 http_responses = 5;
  uint64 http_errors = 6; // Subset of HTTP responses, status 400..599.
  uint64 transport_errors = 7;
  uint64 timeouts = 8;
  uint64 cancelled = 9;
  uint64 response_body_limit_exceeded = 10;
}
message HttpStatusCount {
  uint32 status_code = 1;
  uint64 count = 2;
}
message LatencyHistogram {
  string layout_id = 1; // Exactly latency-us-v1.
  repeated uint64 bucket_counts = 2; // Non-cumulative; bounds specified in docs.
  uint64 overflow_count = 3;
}
message AssignmentSummary {
  AssignmentState state = 1;
  FailureReason failure_reason = 2;
  optional google.protobuf.Timestamp actual_start_at = 3;
  google.protobuf.Timestamp generation_stopped_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  uint64 generation_duration_us = 6; // Monotonic elapsed, excludes drain.
}
